<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>קארו-קאן והאיטלקית</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a club-tournament table. Lines list on the right, the board in the middle, the score sheet on the left. */
:root {
  --bg: #e9eee8;
  --surface: #f9fbf8;
  --raised: #ffffff;
  --ink: #18211c;
  --muted: #56645b;
  --line: #ccd6ce;
  --accent: #8f6300;
  --accent-soft: #f3e6c4;
  --good: #23784a;
  --good-soft: #dcefe2;
  --bad: #b0352f;
  --bad-soft: #f6dcd9;
  --sq-light: #e7e5cd;
  --sq-dark: #789862;
  --sq-hl: rgba(246, 210, 70, .6);
  --sq-sel: rgba(255, 216, 79, .7);
  --arrow: rgba(26, 110, 64, .78);
  --arrow-hint: rgba(214, 140, 0, .9);
  --shadow: 0 1px 2px rgba(20, 40, 28, .08), 0 8px 24px rgba(20, 40, 28, .08);
  --f-display: "Frank Ruhl Libre", "David Libre", "Times New Roman", serif;
  --f-body: "IBM Plex Sans Hebrew", "Assistant", "Segoe UI", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111814; --surface: #18211c; --raised: #1f2a24; --ink: #e5ece7; --muted: #9db0a4; --line: #2e3c34;
    --accent: #e3b04b; --accent-soft: #3a3020; --good: #63c48c; --good-soft: #193526; --bad: #f07b72; --bad-soft: #3d1f1d;
    --sq-light: #d9d7bd; --sq-dark: #6a8a55; --arrow: rgba(40, 150, 90, .85);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111814; --surface: #18211c; --raised: #1f2a24; --ink: #e5ece7; --muted: #9db0a4; --line: #2e3c34;
  --accent: #e3b04b; --accent-soft: #3a3020; --good: #63c48c; --good-soft: #193526; --bad: #f07b72; --bad-soft: #3d1f1d;
  --sq-light: #d9d7bd; --sq-dark: #6a8a55; --arrow: rgba(40, 150, 90, .85);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 32px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.san { font-family: var(--f-mono); font-weight: 500; font-size: .92em; white-space: nowrap; unicode-bidi: isolate; }

/* Header */
.top { max-width: 1440px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; padding-block: 18px 14px; }
.brand { display: flex; flex-direction: column; gap: 0; margin-inline-end: auto; }
.brand h1 { font-family: var(--f-display); font-weight: 900; font-size: 30px; line-height: 1.1; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab {
  display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 16px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); text-align: start; min-width: 0;
}
.tab .ico { width: 34px; height: 34px; background-size: 100%; flex: none; }
.tab b { display: block; font-family: var(--f-display); font-size: 18px; font-weight: 700; line-height: 1.2; }
.tab small { display: block; color: var(--muted); font-size: 12.5px; }
.tab[aria-pressed="true"] { border-color: var(--ink); background: var(--raised); box-shadow: var(--shadow); }

/* Main grid */
.wrap { max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: 310px minmax(0, 1fr) 370px; gap: 20px; align-items: start; }
.side, .panel { min-width: 0; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); max-height: 100vh; overflow-y: auto; padding-bottom: 12px; scrollbar-width: thin; }

/* Sidebar */
.about { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.about h2 { margin: 0; font-family: var(--f-display); font-size: 21px; }
.about .mv { display: inline-block; margin-top: 2px; color: var(--accent); }
.about p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
.about details { margin-top: 8px; }
.about summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.about ul { margin: 6px 0 0; padding-inline-start: 18px; font-size: 14px; display: grid; gap: 4px; }
.prog { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); border-radius: 3px; transition: width .3s; }
.rand { margin-top: 10px; width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px dashed var(--accent); background: transparent; color: var(--accent); font-weight: 600; }
.rand:hover { background: var(--accent-soft); }
.group { margin-top: 18px; }
.group h3 { margin: 0 4px 2px; font-size: 12px; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.group .gb { margin: 0 4px 6px; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.ln {
  width: 100%; display: grid; grid-template-columns: 18px minmax(0,1fr) auto; align-items: center; gap: 8px; padding: 7px 8px;
  border: 0; border-radius: 8px; background: transparent; text-align: start; font-size: 14px; line-height: 1.35;
}
.ln:hover { background: var(--surface); }
.ln[aria-current="true"] { background: var(--raised); box-shadow: inset 3px 0 0 var(--accent), var(--shadow); }
.ln .st { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 10px; }
.ln .st.done { border-color: var(--good); color: var(--good); }
.ln .st.clean { background: var(--good); border-color: var(--good); color: var(--surface); }
.ln .eco { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.ln .tag { display: inline-block; margin-inline-start: 6px; font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); font-weight: 600; vertical-align: 1px; }

/* Board column */
.stage { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.lhead { width: min(100%, 640px); display: flex; flex-direction: column; gap: 2px; }
.lhead .crumb { font-size: 12.5px; color: var(--muted); }
.lhead h2 { margin: 0; font-family: var(--f-display); font-size: 26px; line-height: 1.2; font-weight: 700; text-wrap: balance; }
.lhead p { margin: 2px 0 0; color: var(--muted); font-size: 14.5px; }
.drawer-btn { display: none; align-self: flex-start; margin-bottom: 6px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; }
.modes { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.modes button { border: 0; background: transparent; padding: 7px 18px; font-weight: 600; font-size: 14px; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.toolbar { width: min(100%, 640px); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

.board-wrap { width: min(100%, 640px, calc(100vh - 300px)); min-width: min(100%, 300px); position: relative; }
.board {
  direction: ltr; display: grid; grid-template-columns: repeat(8, 1fr); width: 100%; aspect-ratio: 1; max-width: 100%;
  border-radius: 6px; overflow: hidden; box-shadow: var(--shadow), 0 0 0 1px var(--line); touch-action: none; user-select: none; -webkit-user-select: none;
}
.board.shake { animation: shake .32s; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
.sq { position: relative; background: var(--sq-light); }
.sq.d { background: var(--sq-dark); }
.sq.hl::before, .sq.sel::before, .sq.bad::before { content: ""; position: absolute; inset: 0; background: var(--sq-hl); }
.sq.sel::before { background: var(--sq-sel); }
.sq.bad::before { background: rgba(220, 50, 40, .55); }
.sq.chk { background-image: radial-gradient(circle, rgba(255,40,30,.95) 0%, rgba(230,30,20,.55) 40%, rgba(200,0,0,0) 72%); }
.sq .pc { position: absolute; inset: 0; background-size: 100%; z-index: 2; }
.sq.dragfrom .pc { opacity: .3; }
.sq.dot::after { content: ""; position: absolute; inset: 37%; border-radius: 50%; background: rgba(20, 50, 30, .3); z-index: 3; }
.sq.dot.cap::after { inset: 4%; background: transparent; border: 5px solid rgba(20, 50, 30, .3); }
.co { position: absolute; font: 600 11px/1 var(--f-mono); z-index: 1; pointer-events: none; color: var(--sq-dark); }
.sq.d .co { color: var(--sq-light); }
.co.r { top: 3px; left: 3px; }
.co.f { bottom: 3px; right: 4px; }
.arrows { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.ghost { position: fixed; z-index: 50; pointer-events: none; background-size: 100%; transform: translate(-50%, -50%); filter: drop-shadow(0 6px 8px rgba(0,0,0,.3)); }

.nav { display: flex; gap: 6px; direction: ltr; }
.nav button, .tool {
  min-width: 44px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 15px;
}
.nav button:hover:not(:disabled), .tool:hover { background: var(--raised); }
.nav button:disabled { opacity: .35; cursor: default; }
.nav svg, .tool svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.counter { font: 500 13px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 70px; text-align: center; direction: ltr; }

/* Panel */
.panel { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.card h4 { margin: 0 0 6px; font-size: 12px; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.note { min-height: 128px; }
.note .mvl { font: 600 20px var(--f-mono); direction: ltr; text-align: right; }
.note .mvl .nag { color: var(--accent); }
.note .txt { margin: 6px 0 0; font-size: 15.5px; line-height: 1.65; }
.note .txt.empty { color: var(--muted); }
.ideas ul { margin: 0; padding-inline-start: 18px; display: grid; gap: 5px; font-size: 14.5px; }
.status { border-width: 1px; }
.status.ok { border-color: var(--good); background: var(--good-soft); }
.status.no { border-color: var(--bad); background: var(--bad-soft); }
.status.win { border-color: var(--good); background: var(--good-soft); }
.status .big { font-family: var(--f-display); font-size: 21px; font-weight: 700; line-height: 1.3; }
.status .sub { margin-top: 4px; font-size: 14.5px; }
.status .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.btn { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.stats { display: flex; gap: 18px; margin-top: 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-size: 15px; }

/* Score sheet */
.sheet { padding: 0; overflow: hidden; }
.sheet h4 { padding: 12px 16px 0; }
.sheet-body { position: relative; max-height: 340px; overflow-y: auto; padding: 4px 8px 10px; direction: ltr; }
.sheet table { width: 100%; border-collapse: collapse; font: 500 14px var(--f-mono); font-variant-numeric: tabular-nums; }
.sheet td { padding: 2px 6px; height: 28px; }
.sheet td.n { width: 34px; color: var(--muted); text-align: right; border-right: 1px solid var(--line); }
.sheet .m { display: inline-block; padding: 1px 6px; border-radius: 5px; cursor: pointer; border: 0; background: transparent; font: inherit; }
.sheet .m:hover { background: var(--bg); }
.sheet .m.cur { background: var(--ink); color: var(--bg); }
.sheet .m.has::after { content: "•"; color: var(--accent); margin-left: 3px; }
.sheet .m.cur.has::after { color: var(--accent-soft); }
.sheet .m .nag { color: var(--accent); }
.sheet .m.cur .nag { color: inherit; }
.sheet .m.future { color: var(--muted); opacity: .55; }
.empty-sheet { padding: 10px 16px 14px; color: var(--muted); font-size: 14px; direction: rtl; }
.kbd { font-size: 12.5px; color: var(--muted); }
.kbd kbd { font: 500 11px var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--raised); }

.scrim { display: none; }
.err { max-width: 640px; margin: 40px auto; padding: 16px; border: 1px solid var(--bad); background: var(--bad-soft); border-radius: 12px; }

@media (max-width: 1240px) {
  .wrap { grid-template-columns: minmax(0, 1fr) 340px; }
  .side {
    position: fixed; top: 0; bottom: 0; right: 0; width: min(360px, 88vw); max-height: none; z-index: 40; background: var(--bg);
    padding: calc(16px + env(safe-area-inset-top, 0px)) 14px calc(16px + env(safe-area-inset-bottom, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
    box-shadow: -8px 0 30px rgba(0,0,0,.25); transform: translateX(105%); transition: transform .22s ease; visibility: hidden;
  }
  body.drawer .side { transform: none; visibility: visible; }
  body.drawer .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 39; }
  .drawer-btn { display: inline-flex; gap: 6px; align-items: center; }
}
@media (max-width: 860px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  .board-wrap { width: min(100%, 560px); }
  .brand h1 { font-size: 25px; }
  .tab { flex: 1 1 150px; }
  .lhead h2 { font-size: 22px; }
  .note { min-height: 0; }
  .kbd { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .side, .bar i { transition: none; }
  .board.shake { animation: none; }
}

function parsePgn(text) {
  const out = []; let pre = "";
  const re = /\{([^}]*)\}|(\d+\.(?:\.\.)?)|([^\s{}]+)/g; let m;

    if (m[1] !== undefined) { if (out.length) out[out.length - 1].c = m[1].trim(); else pre = m[1].trim(); }

  }
  return { pre, moves: out };
}

    } else {
      pr.mistakes++; pr.tries++;
      if (pr.tries >= 2) pr.hint = true;
      S.flash = to;
      S.msg = { kind: "no", big: moveLabel(S.idx, legal.san) + " הוא מהלך חוקי, אבל לא המהלך בקו.", sub: pr.hint ? "החץ הכתום מראה את המהלך הנכון." : "נסו שוב. אחרי טעות נוספת יופיע רמז." };
      renderBoard();
      boardEl.classList.remove("shake"); void boardEl.offsetWidth; if (!reduceMotion) boardEl.classList.add("shake");
      setTimeout(() => { if (S.flash === to) { S.flash = null; renderBoard(); } }, 600);
      renderPanel();
    }
  }
  function reveal() {
    if (!userTurn()) return;
    const b = B(); const exp = b.plies[S.idx];
    S.pr.mistakes++; S.pr.reveals++; S.pr.tries = 0; S.pr.hint = false; S.sel = null; S.dots = [];
    S.idx++; S.msg = { kind: "no", big: "המהלך היה " + moveLabel(S.idx - 1, exp.san), sub: "נספר כטעות. נסו לזכור אותו לפעם הבאה." };
    renderBoard(true); renderSheet(); opponent();
  }
  function finish() {
    const pr = S.pr; pr.done = true; pr.waiting = false;
    const prev = progress[S.line.id] || {};
    progress[S.line.id] = { done: true, clean: !!prev.clean || pr.mistakes === 0, best: Math.min(prev.best == null ? 99 : prev.best, pr.mistakes) };
    save("oo-progress", progress);
    renderAll();
  }

  // ---------- navigation ----------
  function go(i, anim) {
    const n = B().plies.length; i = Math.max(0, Math.min(n, i));
    const step = i === S.idx + 1; S.idx = i; S.sel = null; S.dots = [];
    renderBoard(anim && step); renderPanel(); renderSheet(); renderNav();
  }
  $("nStart").onclick = () => go(0);
  $("nPrev").onclick = () => go(S.idx - 1);
  $("nNext").onclick = () => go(S.idx + 1, true);
  $("nEnd").onclick = () => go(B().plies.length);
  document.addEventListener("keydown", (e) => {
    if (S.mode !== "study" || e.target.closest("input,textarea")) return;
    if (e.key === "ArrowRight") { e.preventDefault(); go(S.idx + 1, true); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(S.idx - 1); }
    else if (e.key === "Home") { e.preventDefault(); go(0); }
    else if (e.key === "End") { e.preventDefault(); go(B().plies.length); }
  });
  $("flipBtn").onclick = () => { S.orient = S.orient === "w" ? "b" : "w"; layoutBoard(); renderBoard(); };
  $("mStudy").onclick = () => setMode("study");
  $("mPractice").onclick = () => setMode("practice");
  function setMode(m) {
    clearTimer();
    if (m === "practice") { startPractice(); return; }
    S.mode = "study"; S.pr = null; S.sel = null; S.dots = []; S.flash = null;
    S.orient = S.line.op.side; layoutBoard(); renderAll();
  }

  // ---------- selection ----------
  function selectOpening(id, keepLine) {
    S.op = OPENINGS.find((o) => o.id === id) || OPENINGS[0];
    renderTabs(); renderSide();
    if (!keepLine) selectLine(S.op.all[0].id);
  }
  function selectLine(id) {
    const ln = LINES[id]; if (!ln) return;
    clearTimer();
    if (S.op !== ln.op) { S.op = ln.op; renderTabs(); }
    S.line = ln; S.idx = 0; S.sel = null; S.dots = []; S.flash = null;
    save("oo-last", id);
    try { history.replaceState(null, "", "#" + id); } catch (e) {}
    document.body.classList.remove("drawer");
    renderSide();
    if (S.mode === "practice") startPractice();
    else { S.orient = ln.op.side; layoutBoard(); renderAll(); }
  }
  function nextLine() {
    const all = S.op.all; const i = all.indexOf(S.line);
    selectLine(all[(i + 1) % all.length].id);
  }
  function randomLine() {
    const all = S.op.all; const pool = all.filter((l) => !(progress[l.id] && progress[l.id].clean) && l !== S.line);
    const src = pool.length ? pool : all.filter((l) => l !== S.line);
    S.mode = "practice";
    selectLine(src[Math.floor(Math.random() * src.length)].id);
  }

  // ---------- rendering ----------
  function renderTabs() {
    $("tabs").innerHTML = OPENINGS.map((o) => {
      const done = o.all.filter((l) => progress[l.id] && progress[l.id].done).length;
      return '<button type="button" class="tab" data-op="' + o.id + '" aria-pressed="' + (o === S.op) + '">' +
        '<span class="ico pc-' + o.side + (o.id === "caro" ? "n" : "b") + '"></span><span><b>' + esc(o.name) + "</b><small>" +
        (o.side === "w" ? "משחקים בלבן" : "משחקים בשחור") + " · " + done + "/" + o.all.length + " קווים</small></span></button>";
    }).join("");
    $("tabs").querySelectorAll(".tab").forEach((b) => (b.onclick = () => { if (b.dataset.op !== S.op.id) selectOpening(b.dataset.op); }));
  }
  function renderSide() {
    const op = S.op;
    const done = op.all.filter((l) => progress[l.id] && progress[l.id].done).length;
    let h = '<div class="about"><h2>' + esc(op.name) + '</h2><span class="mv san" dir="ltr">' + esc(op.moves) + "</span><p>" + fmt(op.tagline) + "</p>" +
      '<details><summary>רעיונות מרכזיים</summary><ul>' + op.ideas.map((i) => "<li>" + fmt(i) + "</li>").join("") + "</ul></details>" +
      '<div class="prog"><div class="bar"><i style="width:' + Math.round((done / op.all.length) * 100) + '%"></i></div><span>' + done + " מתוך " + op.all.length + "</span></div>" +
      '<button type="button" class="rand" id="randBtn">תרגול קו אקראי</button></div>';
    for (const g of op.groups) {
      h += '<div class="group"><h3>' + fmt(g.name) + '</h3><div class="gb">' + fmt(g.blurb) + "</div>";
      for (const l of g.lines) {
        const p = progress[l.id];
        const st = p ? (p.clean ? '<span class="st clean">✓</span>' : '<span class="st done">✓</span>') : '<span class="st"></span>';
        const tag = l.kind === "trap" ? '<span class="tag">מלכודת</span>' : l.kind === "game" ? '<span class="tag">משחק מפורסם</span>' : "";
        h += '<button type="button" class="ln" data-id="' + l.id + '" aria-current="' + (l === S.line) + '">' + st +
          "<span>" + fmt(l.name) + tag + '</span><span class="eco">' + l.eco + "</span></button>";
      }
      h += "</div>";
    }
    const side = $("side"); const scroll = side.scrollTop; side.innerHTML = h; side.scrollTop = scroll;
    side.querySelectorAll(".ln").forEach((b) => (b.onclick = () => selectLine(b.dataset.id)));
    $("randBtn").onclick = randomLine;
  }
  function renderHead() {
    const l = S.line;
    $("crumb").innerHTML = esc(l.op.name) + " · " + fmt(l.group.name) + ' · <span class="san">' + l.eco + "</span>";
    $("lineName").innerHTML = fmt(l.name);
    $("lineSum").innerHTML = fmt(l.summary);
    $("mStudy").setAttribute("aria-pressed", S.mode === "study");
    $("mPractice").setAttribute("aria-pressed", S.mode === "practice");
    $("navBar").hidden = S.mode !== "study";
  }
  function renderNav() {
    const n = B().plies.length;
    $("nStart").disabled = $("nPrev").disabled = S.idx === 0;
    $("nNext").disabled = $("nEnd").disabled = S.idx === n;
    $("counter").textContent = S.idx + " / " + n;
  }
  function noteCard() {
    const b = B();
    if (S.idx === 0) {
      return '<div class="card note"><h4>לפני שמתחילים</h4><div class="txt">' + fmt(b.pre || S.line.summary) +
        '</div><div class="txt empty" style="margin-top:8px;font-size:14px">' + (S.mode === "study" ? "לחצו על החץ, על הלוח או על מקש → כדי להתקדם. החץ הירוק על הלוח מראה את המהלך הבא." : "") + "</div></div>";
    }
    const p = b.plies[S.idx - 1];
    return '<div class="card note"><h4>' + (p.color === "w" ? "מהלך של לבן" : "מהלך של שחור") + '</h4><div class="mvl">' + esc(moveLabel(S.idx - 1, fig(p.san))) +
      (p.nag ? '<span class="nag">' + esc(p.nag) + "</span>" : "") + "</div>" +
      (p.c ? '<p class="txt">' + fmt(p.c) + "</p>" : '<p class="txt empty">מהלך טבעי בקו. אין כאן הערה מיוחדת.</p>') + "</div>";
  }
  function ideasCard() {
    return '<div class="card ideas"><h4>מה לזכור בקו הזה</h4><ul>' + S.line.ideas.map((i) => "<li>" + fmt(i) + "</li>").join("") + "</ul></div>";
  }
  function renderPanel() {
    const panel = $("panel");
    let h = "";
    if (S.mode === "study") {
      h = noteCard() + ideasCard() + '<div class="card sheet" id="sheet"></div>';
    } else {
      const pr = S.pr; const b = B(); const sideName = pr.side === "w" ? "הלבן" : "השחור", sideIn = pr.side === "w" ? "בלבן" : "בשחור";
      let st;
      if (pr.done) {
        const p = progress[S.line.id];
        st = '<div class="card status win"><div class="big">' + (pr.mistakes === 0 ? "מושלם! הקו הושלם בלי טעויות." : "הקו הושלם.") + '</div><div class="sub">' +
          (pr.mistakes === 0 ? "הקו מסומן כנלמד." : "היו " + pr.mistakes + " טעויות. נסו שוב כדי לסמן את הקו כנלמד בלי טעויות.") +
          '</div><div class="stats"><span>טעויות <b>' + pr.mistakes + '</b></span><span>הכי טוב <b>' + (p ? p.best : pr.mistakes) + "</b></span></div>" +
          '<div class="row"><button type="button" class="btn primary" id="pNext">לקו הבא</button><button type="button" class="btn" id="pAgain">שוב</button><button type="button" class="btn" id="pStudy">לימוד הקו</button></div></div>';
      } else {
        const turn = userTurn();
        const m = S.msg || {};
        const kind = m.kind === "no" ? " no" : m.kind === "ok" && !turn ? " ok" : "";
        const big = pr.waiting ? "היריב משחק..." : turn ? (m.kind === "no" ? m.big : "תורך: מצאו את המהלך של " + sideName) : m.big;
        const sub = turn ? (m.kind === "no" ? m.sub : (S.idx > 0 && m.kind === "ok" ? fmt(m.big) + ". " : "") + "גררו או לחצו על כלי ואז על המשבצת.") : "";
        st = '<div class="card status' + kind + '"><h4>תרגול · אתם משחקים ' + sideIn + '</h4><div class="big">' + fmt(big) + '</div><div class="sub">' + sub + "</div>" +
          '<div class="stats"><span>מהלך <b>' + Math.min(S.idx + 1, b.plies.length) + "/" + b.plies.length + "</b></span><span>טעויות <b>" + pr.mistakes + "</b></span></div>" +
          '<div class="row"><button type="button" class="btn" id="pHint"' + (turn ? "" : " disabled") + '>רמז</button><button type="button" class="btn" id="pReveal"' + (turn ? "" : " disabled") +
          '>הראו את המהלך</button><button type="button" class="btn" id="pRestart">מההתחלה</button></div></div>';
      }
      h = st + (S.idx > 0 ? noteCard() : ideasCard()) + '<div class="card sheet" id="sheet"></div>';
    }
    panel.innerHTML = h;
    const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
    on("pNext", nextLine); on("pAgain", startPractice); on("pStudy", () => setMode("study")); on("pRestart", startPractice);
    on("pReveal", reveal);
    on("pHint", () => { if (userTurn()) { S.pr.hint = true; const exp = B().plies[S.idx]; select(exp.from); renderBoard(); } });
    renderSheet();
  }
  function renderSheet() {
    const el = $("sheet"); if (!el) return;
    const b = B(); const n = b.plies.length;
    const shown = S.mode === "study" ? n : S.idx;
    if (!shown) { el.innerHTML = '<h4>טופס המהלכים</h4><div class="empty-sheet">המהלכים יופיעו כאן.</div>'; return; }
    let rows = "";
    for (let i = 0; i < shown; i += 2) {
      const cell = (j) => {
        if (j >= shown) return "<td></td>";
        const p = b.plies[j];
        const cls = "m" + (j === S.idx - 1 ? " cur" : "") + (p.c ? " has" : "") + (S.mode === "study" && j >= S.idx ? " future" : "");
        return '<td><button type="button" class="' + cls + '" data-i="' + (j + 1) + '">' + esc(fig(p.san)) + (p.nag ? '<span class="nag">' + esc(p.nag) + "</span>" : "") + "</button></td>";
      };
      rows += '<tr><td class="n">' + (i / 2 + 1) + ".</td>" + cell(i) + cell(i + 1) + "</tr>";
    }
    el.innerHTML = '<h4>טופס המהלכים</h4><div class="sheet-body" id="sheetBody"><table>' + rows + "</table></div>";
    if (S.mode === "study") el.querySelectorAll(".m").forEach((m) => (m.onclick = () => go(+m.dataset.i, +m.dataset.i === S.idx + 1)));
    const cur = el.querySelector(".m.cur"); const body = $("sheetBody");
    if (cur && body) { const top = cur.offsetTop - body.clientHeight / 2; body.scrollTop = Math.max(0, top); }
  }
  function renderAll() { renderHead(); renderBoard(); renderPanel(); renderNav(); renderTabs(); }

  // ---------- drawer ----------
  $("drawerBtn").onclick = () => document.body.classList.add("drawer");
  $("scrim").onclick = () => document.body.classList.remove("drawer");
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.body.classList.remove("drawer"); });

  // ---------- boot ----------
  function start(data) {
    const hash = (location.hash || "").slice(1);
    const id = (data && data.line) || (LINES[hash] ? hash : null) || load("oo-last", null);
    const ln = LINES[id] || OPENINGS[0].all[0];
    S.op = ln.op; S.mode = "study"; renderTabs();
    selectLine(ln.id);
    if (data && data.idx && S.mode === "study") go(data.idx);
  }
  window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ line: S.line && S.line.id, idx: S.mode === "study" ? S.idx : 0 }));
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();

</script>

</body>
</html>
